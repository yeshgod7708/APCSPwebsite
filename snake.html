<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <title>Snake Game by Googolplex</title> 
    <meta charset="utf-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1"> 
    <link rel="stylesheet" href="https://bootstrapcdn.com"> 
    <script src="https://googleapis.com"></script> 
    <script src="https://bootstrapcdn.com"></script> 
    <link rel="icon" href="https://codehs.com" type="image/x-icon"> 
    <style> 
        /* Center everything and style the background */ 
        body { 
            background-color: #1a1a1a; 
            color: #ffffff; 
            font-family: 'Arial', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden; 
        } 
        nav {
            position: absolute;
            top: 0;
            width: 100%;
        }
        h1 { 
            margin-top: 80px;
            margin-bottom: 10px; 
        } 
        #score-board { 
            font-size: 24px; 
            margin-bottom: 20px; 
        } 
        #high-score-board {
            font-size: 20px;
            color: #ffeb3b;
            margin-bottom: 20px;
        }
        #pause-msg {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 10px;
            height: 20px;
        }
        /* The game board canvas */ 
        #snakeCanvas { 
            background-color: #111; 
            border: 4px solid #4caf50; 
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5); 
        } 
    </style> 
</head> 
<body> 
    <button class="exit-link btn btn-light text-danger" href="games.html">Exit</button>

    <h1>Snake Game</h1> 
    <div id="score-board">Score: <span id="score">0</span></div> 
    <div id="high-score-board">High Score: <span id="high-score">0</span></div>
    <div id="pause-msg">Press SPACE or P to Pause</div>
    
    <canvas id="snakeCanvas" width="400" height="400"></canvas> 

    <script> 
        const canvas = document.getElementById("snakeCanvas"); 
        const ctx = canvas.getContext("2d"); 
        const scoreElement = document.getElementById("score"); 
        const highScoreElement = document.getElementById("high-score");
        const pauseMsgElement = document.getElementById("pause-msg");

        // Grid setup 
        const gridSize = 20; 
        const tileCount = canvas.width / gridSize; 

        // Game variables 
        let score = 0; 
        let highScore = localStorage.getItem("snakeHighScore") || 0;
        let snake = [{ x: 10, y: 10 }]; 
        let food = { x: 5, y: 5 }; 
        let dx = 1; 
        let dy = 0; 
        let isPaused = false;
        let gameSpeed = 100; 

        // Display initial high score
        highScoreElement.innerText = highScore;

        // Start the game loop 
        main(); 

        function main() { 
            if (hasGameEnded()) { 
                // Check if current score beats high score before resetting
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem("snakeHighScore", highScore);
                    highScoreElement.innerText = highScore;
                }
                alert(`Game Over! Your final score is ${score}`); 
                resetGame(); 
            } 

            // Only update game mechanics if NOT paused
            if (!isPaused) {
                clearCanvas(); 
                drawFood(); 
                moveSnake(); 
                drawSnake(); 
            } else {
                // If paused, keep drawing the static screen so it doesn't flicker
                clearCanvas();
                drawFood();
                drawSnake();
                drawPauseOverlay();
            }

            setTimeout(main, gameSpeed); 
        } 

        function clearCanvas() { 
            ctx.fillStyle = "#111"; 
            ctx.fillRect(0, 0, canvas.width, canvas.height); 
        } 

        function drawSnake() { 
            ctx.fillStyle = "#4caf50"; 
            snake.forEach(part => { 
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2); 
            }); 
        } 

        function moveSnake() { 
            const head = { x: snake[0].x + dx, y: snake[0].y + dy }; 
            snake.unshift(head); 

            if (head.x === food.x && head.y === food.y) { 
                score += 10; 
                scoreElement.innerText = score; 
                generateFood(); 
            } else { 
                snake.pop(); 
            } 
        } 

        function generateFood() { 
            food.x = Math.floor(Math.random() * tileCount); 
            food.y = Math.floor(Math.random() * tileCount); 

            snake.forEach(part => { 
                if (part.x === food.x && part.y === food.y) { 
                    generateFood(); 
                } 
            }); 
        } 

        function drawFood() { 
            ctx.fillStyle = "#ff5722"; 
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2); 
        } 

        function drawPauseOverlay() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ffffff";
            ctx.font = "30px Arial";
            ctx.textAlign = "center";
            ctx.fillText("PAUSED", canvas.width / 2, canvas.height / 2);
        }

        function hasGameEnded() { 
            for (let i = 4; i < snake.length; i++) { 
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true; 
            } 
            const hitLeftWall = snake[0].x < 0; 
            const hitRightWall = snake[0].x >= tileCount; 
            const hitToptWall = snake[0].y < 0; 
            const hitBottomWall = snake[0].y >= tileCount; 

            return hitLeftWall || hitRightWall || hitToptWall || hitBottomWall; 
        } 

        function resetGame() { 
            score = 0; 
            scoreElement.innerText = score; 
            snake = [{ x: 10, y: 10 }]; 
            dx = 1; 
            dy = 0; 
            isPaused = false;
            pauseMsgElement.innerText = "Press SPACE or P to Pause";
            generateFood(); 
        } 

        document.addEventListener("keydown", changeDirection); 

        function changeDirection(event) { 
            const keyPressed = event.keyCode; 
            const keyString = event.key.toLowerCase(); 

            // Key codes for Arrow keys and Space
            const LEFT_KEY = 37; 
            const UP_KEY = 38; 
            const RIGHT_KEY = 39; 
            const DOWN_KEY = 40; 
            const SPACE_KEY = 32;

            // Handle Pause Toggle
            if (keyString === 'p' || keyPressed === SPACE_KEY) {
                // Prevent browser page from scrolling down when pressing spacebar
                event.preventDefault(); 
                isPaused = !isPaused;
                pauseMsgElement.innerText = isPaused ? "Press SPACE or P to Resume" : "Press SPACE or P to Pause";
                return;
            }

            // Block movement inputs while paused
            if (isPaused) return;

            const goingUp = dy === -1; 
            const goingDown = dy === 1; 
            const goingRight = dx === 1; 
            const goingLeft = dx === -1; 

            if ((keyPressed === LEFT_KEY || keyString === 'a') && !goingRight) { 
                dx = -1; 
                dy = 0; 
            } 
            if ((keyPressed === UP_KEY || keyString === 'w') && !goingDown) { 
                dx = 0; 
                dy = -1; 
            } 
            if ((keyPressed === RIGHT_KEY || keyString === 'd') && !goingLeft) { 
                dx = 1; 
                dy = 0; 
            } 
            if ((keyPressed === DOWN_KEY || keyString === 's') && !goingUp) { 
                dx = 0; 
                dy = 1; 
            } 
        } 
    </script> 
</body> 
</html>
